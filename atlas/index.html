<title>The Element Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script>/* apply a saved theme before first paint */ try { var t = localStorage.getItem('element-atlas-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Schibsted+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a one-screen instrument. Header with views; each view is a grid of 3D stage plus reading panel.
   Dark-first with a light theme. The 3D stages stay a dark viewport in both themes, because glowing
   electrons and orbital clouds only read on a dark background. */
:root {
  color-scheme: dark;
  --ink: #080d13;
  --panel: #0d151d;
  --raise: #131e28;
  --hover: #1a2a37;
  --cur: #16283a;
  --line: #213140;
  --line-2: #2e4456;
  --text: #dce6ee;
  --muted: #8b9cab;
  --faint: #5d6e7d;
  --accent: #6fd3ff;
  --warm: #ffbf4f;
  --shadow: rgba(0, 0, 0, .45);
  /* the 3D viewport (same in both themes) */
  --st-bg1: #0e1924;
  --st-bg2: #080d13;
  --st-panel: rgba(8, 13, 19, .78);
  --st-raise: #131e28;
  --st-line: #213140;
  --st-line-2: #2e4456;
  --st-text: #dce6ee;
  --st-muted: #8b9cab;
  --st-faint: #5d6e7d;
  --st-accent: #6fd3ff;
  --st-warm: #ffbf4f;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Schibsted Grotesk", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --ink: #edf1f5; --panel: #ffffff; --raise: #f1f4f7; --hover: #e4ebf1; --cur: #dbe9f4;
    --line: #d3dce4; --line-2: #b6c3ce; --text: #132029; --muted: #4c5c69; --faint: #74838f;
    --accent: #0a6c9b; --warm: #9a5600; --shadow: rgba(19, 32, 41, .18);
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --ink: #edf1f5; --panel: #ffffff; --raise: #f1f4f7; --hover: #e4ebf1; --cur: #dbe9f4;
  --line: #d3dce4; --line-2: #b6c3ce; --text: #132029; --muted: #4c5c69; --faint: #74838f;
  --accent: #0a6c9b; --warm: #9a5600; --shadow: rgba(19, 32, 41, .18);
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--ink); color: var(--text); font: 14px/1.5 var(--body); overflow: hidden; }
button, select, input { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }
sub, sup { font-size: .72em; line-height: 0; }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr; grid-template-columns: minmax(0, 1fr); }
.top {
  display: flex; align-items: center; gap: 18px; flex-wrap: wrap; border-bottom: 1px solid var(--line); background: var(--panel);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.brand { font: 700 19px/1 var(--display); letter-spacing: -.01em; display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
.brand small { font: 500 10.5px/1 var(--mono); color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tabs button { background: none; border: 1px solid transparent; border-radius: 8px; padding: 7px 12px; cursor: pointer; color: var(--muted); font-weight: 500; }
.tabs button:hover { color: var(--text); background: var(--raise); }
.tabs button[aria-selected="true"] { color: var(--text); border-color: var(--line-2); background: var(--raise); }
.search { margin-left: auto; position: relative; min-width: 0; flex: 0 1 300px; }
.search input { width: 100%; background: var(--raise); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.search input::placeholder { color: var(--faint); }
.results { position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 30; background: var(--raise); border: 1px solid var(--line-2); border-radius: 10px; overflow: hidden; max-height: 60vh; overflow-y: auto; box-shadow: 0 12px 30px var(--shadow); }
.results button { display: flex; width: 100%; gap: 10px; align-items: baseline; text-align: left; padding: 8px 12px; background: none; border: 0; cursor: pointer; }
.results button:hover, .results button.active { background: var(--hover); }
.theme-btn { display: inline-flex; align-items: center; gap: 6px; background: var(--raise); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; cursor: pointer; color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.theme-btn:hover { color: var(--text); border-color: var(--line-2); }
.theme-btn svg { width: 15px; height: 15px; }
.results .k { font: 500 11px var(--mono); color: var(--muted); margin-left: auto; white-space: nowrap; }

.view { min-height: 0; overflow: hidden; }
.view[hidden] { display: none !important; }

/* ---------- Periodic table ---------- */
#v-table { overflow-y: auto; }
.table-wrap { padding-block: 18px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; }
.table-head { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: end; justify-content: space-between; }
.table-head h1 { font: 700 30px/1.05 var(--display); margin: 0; text-wrap: balance; letter-spacing: -.015em; }
.table-head p { margin: 6px 0 0; color: var(--muted); max-width: 64ch; }
.colorby { display: flex; align-items: center; gap: 8px; }
.colorby label { color: var(--muted); font-size: 12px; }
select { background: var(--raise); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
.legend .ramp { width: 160px; height: 10px; border-radius: 3px; }
.pt-scroll { overflow-x: auto; padding-bottom: 6px; }
.pt { display: grid; grid-template-columns: repeat(18, minmax(50px, 1fr)); grid-auto-rows: minmax(58px, auto); gap: 3px; min-width: 960px; position: relative; }
.cell {
  position: relative; border-radius: 6px; padding: 4px 5px 4px; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between;
  background: color-mix(in srgb, var(--c) 14%, var(--raise)); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); color: var(--text);
  text-align: left; min-width: 0;
}
.cell:hover, .cell:focus-visible { background: color-mix(in srgb, var(--c) 30%, var(--raise)); border-color: var(--c); transform: translateY(-1px); }
.cell.fill { background: var(--c); border-color: transparent; color: var(--on, #0b1118); }
.cell.fill .z, .cell.fill .nm { color: var(--on, #0b1118); opacity: .78; }
.cell.dim { opacity: .28; }
.cell.pred { border-style: dashed; }
.cell .z { font: 500 10px/1 var(--mono); color: var(--muted); }
.cell .sy { font: 700 19px/1 var(--display); color: var(--c); }
.cell.fill .sy { color: var(--on, #0b1118); }
.cell .nm { font-size: 9.5px; line-height: 1.1; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell.ph { cursor: default; border-style: dashed; justify-content: center; align-items: center; text-align: center; font: 500 10px/1.2 var(--mono); color: var(--muted); background: transparent; }
.gap-row { height: 10px; }
.glabel { font: 500 10px/1 var(--mono); color: var(--faint); align-self: end; text-align: center; padding-bottom: 3px; }
.plabel { font: 500 10px/1 var(--mono); color: var(--faint); }
.peek {
  grid-column: 3 / 13; grid-row: 1 / 4; align-self: stretch; margin: 0 6px 4px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel);
  display: grid; grid-template-columns: 96px 1fr auto; gap: 14px; padding: 10px 14px; align-items: center; min-width: 0;
}
.peek .big { width: 96px; height: 96px; border-radius: 10px; display: flex; flex-direction: column; justify-content: center; align-items: center; background: color-mix(in srgb, var(--c) 18%, var(--raise)); border: 1px solid var(--c); }
.peek .big b { font: 700 40px/1 var(--display); color: var(--c); }
.peek .big span { font: 500 11px var(--mono); color: var(--muted); }
.peek h3 { margin: 0; font: 700 20px/1.1 var(--display); }
.peek .sub { color: var(--muted); font-size: 12px; }
.peek dl { display: grid; grid-template-columns: auto auto; gap: 1px 12px; margin: 6px 0 0; font-size: 12px; }
.peek dt { color: var(--muted); } .peek dd { margin: 0; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.peek img { width: 120px; height: 96px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
.peek .noimg { width: 120px; height: 96px; border-radius: 8px; border: 1px dashed var(--line-2); color: var(--faint); font-size: 11px; display: grid; place-items: center; text-align: center; padding: 6px; }

/* ---------- Shared 3D stage + panel ---------- */
.split { height: 100%; display: grid; grid-template-columns: 1fr minmax(320px, 420px); min-height: 0; }
.split.three { grid-template-columns: minmax(220px, 270px) 1fr minmax(300px, 380px); }
.stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; color: var(--st-text); background: radial-gradient(120% 90% at 50% 40%, var(--st-bg1) 0%, var(--st-bg2) 70%); }
.stage .muted { color: var(--st-muted); }
.stage .chipbtn { background: var(--st-raise); border-color: var(--st-line); color: var(--st-text); }
.stage .chipbtn:hover { border-color: var(--st-line-2); }
.stage .chipbtn[aria-pressed="true"] { border-color: var(--st-accent); color: var(--st-accent); }
.hud { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; pointer-events: none; }
.hud .chip { font: 500 12px var(--mono); font-variant-numeric: tabular-nums; background: var(--st-panel); border-color: var(--st-line); color: var(--st-text); backdrop-filter: blur(6px); white-space: nowrap; }
.hud .chip b { font-weight: 500; color: var(--st-muted); margin-right: 6px; }
.hud .chip.hb { color: var(--st-warm); }
.hud .chip canvas { width: 66px; height: 20px; margin-left: 8px; vertical-align: middle; }
/* the 3D canvas is the stage's direct child; other canvases (the H-bond chart) are left alone */
.stage > canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
.stage > canvas:active { cursor: grabbing; }
@media (min-width: 861px) { .stage .cap { max-height: 24vh; overflow-y: auto; } }
.stage-top { position: absolute; top: 10px; left: 12px; right: calc(max(12px, env(safe-area-inset-right, 0px)) + 44px); display: flex; gap: 6px; flex-wrap: wrap; z-index: 5; pointer-events: none; }
.stage-top > * { pointer-events: auto; }
.levels { display: flex; gap: 4px; flex-wrap: wrap; background: var(--st-panel); border: 1px solid var(--st-line); border-radius: 10px; padding: 4px; backdrop-filter: blur(6px); }
.levels[hidden] { display: none !important; }
.levels button { background: none; border: 0; border-radius: 7px; padding: 6px 10px; cursor: pointer; color: var(--st-muted); font-weight: 500; display: flex; gap: 6px; align-items: baseline; }
.levels button i { font: 500 10px var(--mono); font-style: normal; color: var(--st-faint); }
.levels button:hover { color: var(--st-text); }
.levels button[aria-selected="true"] { background: var(--st-raise); color: var(--st-text); box-shadow: inset 0 0 0 1px var(--st-line-2); }
.stage-bottom { position: absolute; left: 12px; right: max(12px, env(safe-area-inset-right, 0px)); bottom: 10px; display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; z-index: 5; pointer-events: none; }
.stage-bottom > * { pointer-events: auto; }
.cap { max-width: 560px; background: var(--st-panel); border: 1px solid var(--st-line); border-radius: 10px; padding: 8px 12px; font-size: 12.5px; color: var(--st-text); backdrop-filter: blur(6px); }
.cap b { color: var(--st-accent); font-weight: 500; }
.ctrls { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; background: var(--st-panel); border: 1px solid var(--st-line); border-radius: 10px; padding: 6px 8px; backdrop-filter: blur(6px); font-size: 12px; color: var(--st-text); color-scheme: dark; }
.ctrls label { display: inline-flex; align-items: center; gap: 5px; color: var(--st-muted); cursor: pointer; }
.ctrls input[type="checkbox"] { accent-color: var(--st-accent); }
.ctrls input[type="range"] { accent-color: var(--st-warm); width: 140px; }
.ctrls .val { font: 500 12px var(--mono); color: var(--st-warm); min-width: 8ch; }
.ctrls .slider { white-space: nowrap; margin-right: 6px; }
.ctrls .slider > span:first-child { min-width: 9.5ch; }
.chipbtn { background: var(--raise); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; cursor: pointer; font-size: 12px; }
.chipbtn:hover { border-color: var(--line-2); }
.chipbtn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.fs-btn { position: absolute; top: 10px; right: max(12px, env(safe-area-inset-right, 0px)); z-index: 6; width: 36px; height: 36px; padding: 0; display: grid; place-items: center; background: var(--st-panel); border: 1px solid var(--st-line); border-radius: 9px; color: var(--st-text); cursor: pointer; backdrop-filter: blur(6px); }
.fs-btn:hover { border-color: var(--st-line-2); color: var(--st-accent); }
.fs-btn svg { width: 18px; height: 18px; }
.hint3d { position: absolute; right: max(14px, env(safe-area-inset-right, 0px)); top: 54px; font-size: 11px; color: var(--st-faint); pointer-events: none; z-index: 4; }

.panel { min-width: 0; min-height: 0; overflow-y: auto; background: var(--panel); border-left: 1px solid var(--line); padding-block: 18px 40px; padding-left: 20px; padding-right: max(20px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 20px; }
.panel h2 { font: 500 11px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.panel p { margin: 0; max-width: 64ch; }
.panel .muted { color: var(--muted); }
.el-head { display: grid; grid-template-columns: 88px 1fr; gap: 14px; align-items: center; }
.el-tile { width: 88px; height: 88px; border-radius: 12px; border: 1.5px solid var(--c); background: color-mix(in srgb, var(--c) 16%, var(--raise)); display: flex; flex-direction: column; justify-content: space-between; padding: 7px 9px; }
.el-tile .z { font: 500 11px var(--mono); color: var(--muted); }
.el-tile .sy { font: 700 36px/1 var(--display); color: var(--c); }
.el-tile .m { font: 500 10px var(--mono); color: var(--muted); }
.el-head h1 { margin: 0; font: 700 28px/1.05 var(--display); letter-spacing: -.01em; }
.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 9px; font-size: 12px; border: 1px solid var(--line-2); color: var(--muted); }
.chip.cat { color: var(--c); border-color: color-mix(in srgb, var(--c) 60%, transparent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.navrow { display: flex; gap: 8px; }
.navrow button { flex: 1; background: var(--raise); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; cursor: pointer; font-size: 12.5px; text-align: left; }
.navrow button:last-child { text-align: right; }
.navrow button:hover { border-color: var(--line-2); }
.photo { margin: 0; display: flex; flex-direction: column; gap: 6px; }
.photo img { width: 100%; max-height: 260px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); background: #000; cursor: zoom-in; }
.photo figcaption { font-size: 12.5px; }
.photo .credit { font-size: 11px; color: var(--faint); }
.nophoto { border: 1px dashed var(--line-2); border-radius: 10px; padding: 14px; color: var(--muted); font-size: 12.5px; }
.props { display: grid; grid-template-columns: auto 1fr; gap: 5px 14px; margin: 0; font-size: 13px; }
.props dt { color: var(--muted); }
.props dd { margin: 0; font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums; min-width: 0; overflow-wrap: anywhere; }
.props dd .p { color: var(--warm); font-family: var(--body); font-size: 11px; margin-left: 6px; }
.config { font: 500 14px/1.6 var(--mono); }
.boxes { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
.boxes .sub { display: flex; flex-direction: column; gap: 3px; align-items: center; }
.boxes .row { display: flex; }
.boxes .orb { width: 22px; height: 24px; border: 1px solid var(--line-2); margin-left: -1px; display: grid; place-items: center; font: 500 12px/1 var(--mono); color: var(--accent); }
.boxes .lab { font: 500 10.5px var(--mono); color: var(--muted); }
.iso { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.iso th { text-align: left; color: var(--muted); font-weight: 500; padding: 3px 6px 3px 0; border-bottom: 1px solid var(--line); }
.iso td { padding: 4px 6px 4px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.iso td.n { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar { height: 6px; border-radius: 3px; background: var(--accent); min-width: 2px; }
ul.plain { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.cmp-links { display: flex; flex-wrap: wrap; gap: 6px; }
.cmp-links button { background: var(--raise); border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; cursor: pointer; font-size: 12.5px; }
.cmp-links button:hover { border-color: var(--accent); }
.origin { display: flex; flex-wrap: wrap; gap: 6px; }
.note { font-size: 12px; color: var(--faint); border-top: 1px solid var(--line); padding-top: 12px; }
.pred-tag { color: var(--warm); font-size: 11px; font-family: var(--body); }

/* ---------- Compound list ---------- */
.list { min-height: 0; overflow: hidden; display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid var(--line); }
.list-head { padding: 12px; padding-left: max(12px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--line); }
.list-head input { width: 100%; background: var(--raise); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
.list-head select { width: 100%; }
.list-body { overflow-y: auto; padding: 6px 6px 30px; padding-left: max(6px, env(safe-area-inset-left, 0px)); }
.list-body h4 { margin: 12px 8px 4px; font: 500 10.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.list-body button { display: flex; width: 100%; justify-content: space-between; gap: 8px; align-items: baseline; background: none; border: 0; border-radius: 7px; padding: 6px 8px; cursor: pointer; text-align: left; }
.list-body button:hover { background: var(--raise); }
.list-body button[aria-current="true"] { background: var(--cur); box-shadow: inset 2px 0 0 var(--accent); }
.list-body .f { font: 500 11.5px var(--mono); color: var(--muted); white-space: nowrap; }
.formula-big { font: 500 22px/1.2 var(--mono); color: var(--accent); }

/* ---------- Combine ---------- */
.pick { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: end; }
.pick label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0; }
.pick select { width: 100%; }
.plus { font: 700 22px var(--display); color: var(--muted); padding-bottom: 6px; }
.verdict { border: 1px solid var(--line-2); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px; background: var(--raise); }
.verdict .kind { font: 700 22px/1.1 var(--display); }
.meter { position: relative; height: 26px; margin-top: 4px; }
/* thresholds on a 0–3.3 Δχ scale: 0.4 → 12.1 %, 1.8 → 54.5 % */
.meter .track { position: absolute; left: 0; right: 0; top: 8px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, #5fb7ff 0%, #5fb7ff 12.1%, #9ccc65 12.1%, #9ccc65 54.5%, #ff8a5c 54.5%, #ff8a5c 100%); opacity: .8; }
.meter .mk { position: absolute; top: 2px; width: 3px; height: 20px; background: var(--text); border-radius: 2px; transform: translateX(-1px); }
.meter-l { position: relative; height: 16px; font: 500 10.5px var(--mono); color: var(--muted); }
.meter-l span { position: absolute; top: 0; white-space: nowrap; }
.meter-l span:nth-child(2), .meter-l span:nth-child(3) { transform: translateX(-50%); }
.meter-l span:first-child { left: 0; }
.meter-l span:last-child { right: 0; }
.meter-l2 { display: flex; justify-content: space-between; font: 500 10.5px var(--mono); color: var(--muted); }

.lightbox { position: fixed; inset: 0; background: rgba(4,7,10,.92); z-index: 50; display: grid; place-items: center; padding: 24px; cursor: zoom-out; }
.lightbox img { max-width: 100%; max-height: 82vh; border-radius: 10px; }
.lightbox p { color: var(--st-muted); text-align: center; margin: 10px 0 0; font-size: 13px; }
.loading { display: grid; place-items: center; height: 100%; color: var(--muted); font-family: var(--mono); }

@media (max-width: 980px) {
  .split.three { grid-template-columns: 1fr; grid-template-rows: auto minmax(300px, 50%) auto; overflow-y: auto; }
  .split.three .list { max-height: 34vh; border-right: 0; border-bottom: 1px solid var(--line); }
  .split.three .panel { border-left: 0; overflow: visible; }
}
@media (max-width: 860px) {
  body { overflow: hidden; }
  /* one scrolling column; in every 3D view the caption and controls sit below the canvas instead of covering it */
  .split { display: flex; flex-direction: column; overflow-y: auto; }
  .split .panel { border-left: 0; border-top: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .split .list, .split .panel { flex-shrink: 0; }
  .split .panel { overflow: visible; }
  .split .stage { flex: 0 0 auto; display: flex; flex-direction: column; }
  .split .stage > canvas { position: relative; inset: auto; height: 360px; flex: 0 0 360px; }
  .split .stage-bottom { position: static; padding: 8px 12px 12px; }
  .split .stage-bottom > * { flex: 1 1 100%; }
  .split .cap { max-height: none; max-width: none; }
  .search { flex: 1 1 200px; margin-left: 0; }
  .theme-btn span { display: none; }
  .hud .chip { font-size: 11px; padding: 2px 7px; }
  .top { gap: 8px 12px; padding-block: 8px; }
  .brand small { display: none; }
  .tabs { flex-wrap: nowrap; overflow-x: auto; max-width: 100%; scrollbar-width: none; }
  .tabs button { padding: 6px 10px; white-space: nowrap; font-size: 13px; }
  .search input { padding: 6px 10px; }
  .cap { max-height: 58px; overflow-y: auto; font-size: 11.5px; padding: 6px 10px; }
  .ctrls { padding: 4px 6px; }
  .levels button { font-size: 12.5px; }
  .peek { grid-template-columns: 70px 1fr; }
  .peek .big { width: 70px; height: 70px; } .peek .big b { font-size: 30px; }
  .peek img, .peek .noimg { display: none; }

}
@media (prefers-reduced-motion: reduce) { .cell:hover { transform: none; } }

/* ---------- Full-screen 3D stage (native :fullscreen, or .is-max when the page may not go full screen) ---------- */
.split .stage.is-max { position: fixed; inset: 0; z-index: 60; }
.split .stage.is-max, .split .stage:fullscreen { display: block; width: 100%; height: 100%; height: 100dvh; }
.split .stage.is-max > canvas, .split .stage:fullscreen > canvas { position: absolute; inset: 0; height: 100%; flex: none; }
.split .stage.is-max .stage-bottom, .split .stage:fullscreen .stage-bottom { position: absolute; padding: 0; bottom: max(10px, env(safe-area-inset-bottom, 0px)); }
.split .stage.is-max .cap, .split .stage:fullscreen .cap { max-height: 28vh; overflow-y: auto; }
.split .stage.is-max .stage-top, .split .stage.is-max .fs-btn, .split .stage:fullscreen .stage-top, .split .stage:fullscreen .fs-btn { top: max(10px, env(safe-area-inset-top, 0px)); }
body.stage-maxed { overflow: hidden; }
</style>

<div class="app">
  <header class="top">
    <div class="brand">The Element Atlas <small>118 elements in 3D</small></div>
    <nav class="tabs" role="tablist" aria-label="Views">
      <button type="button" role="tab" id="tab-table" data-view="table" aria-selected="true">Periodic table</button>
      <button type="button" role="tab" id="tab-element" data-view="element" aria-selected="false">Element explorer</button>
      <button type="button" role="tab" id="tab-compounds" data-view="compounds" aria-selected="false">Compounds</button>
      <button type="button" role="tab" id="tab-combine" data-view="combine" aria-selected="false">Combine two elements</button>
    </nav>
    <div class="search">
      <input id="q" type="search" placeholder="Search elements and compounds…" autocomplete="off" aria-label="Search elements and compounds">
      <div class="results" id="qres" hidden></div>
    </div>
    <button type="button" class="theme-btn" id="theme-btn" aria-label="Switch between dark and light theme"></button>
  </header>

  <section class="view" id="v-table" aria-label="Periodic table">
    <div class="loading">Loading the elements…</div>
  </section>

  <section class="view" id="v-element" hidden aria-label="Element explorer">
    <div class="split">
      <div class="stage" id="stage-element">
        <div class="stage-top">
          <div class="levels" id="levels" role="tablist" aria-label="Level of detail"></div>
          <div class="hud" id="el-hud" hidden>
            <span class="chip"><b>T</b><span data-hud="t">—</span></span>
            <span class="chip hb" data-hud="hb-chip"><b>H-bonds</b><span data-hud="hb">0</span></span>
            <span class="chip hb" data-hud="spark-chip" title="Hydrogen bonds per molecule over time"><b>per molecule</b><span data-hud="per">0.00</span><canvas data-hud="spark" width="132" height="40" aria-hidden="true"></canvas></span>
            <span class="chip"><b>time</b><span data-hud="time">0.00 ps</span></span>
          </div>
        </div>
        <button type="button" class="fs-btn" aria-label="Full screen"></button>
        <div class="hint3d">Drag to turn · scroll or pinch to zoom</div>
        <div class="stage-bottom">
          <div class="cap" id="el-cap"></div>
          <div class="ctrls" id="el-ctrls"></div>
        </div>
      </div>
      <aside class="panel" id="el-panel"></aside>
    </div>
  </section>

  <section class="view" id="v-compounds" hidden aria-label="Compounds">
    <div class="split three">
      <div class="list">
        <div class="list-head">
          <input id="cq" type="search" placeholder="Filter by name, formula or element" aria-label="Filter compounds">
          <select id="ccat" aria-label="Category"></select>
        </div>
        <div class="list-body" id="clist"></div>
      </div>
      <div class="stage" id="stage-compound">
        <div class="stage-top">
          <div class="levels" id="c-scenes" role="tablist" aria-label="Scene" hidden></div>
          <div class="hud" id="c-hud" hidden>
            <span class="chip"><b>T</b><span data-hud="t">—</span></span>
            <span class="chip hb" data-hud="hb-chip"><b>H-bonds</b><span data-hud="hb">0</span></span>
            <span class="chip hb" data-hud="spark-chip" title="Hydrogen bonds per molecule over time"><b>per molecule</b><span data-hud="per">0.00</span><canvas data-hud="spark" width="132" height="40" aria-hidden="true"></canvas></span>
            <span class="chip"><b>time</b><span data-hud="time">0.00 ps</span></span>
          </div>
        </div>
        <button type="button" class="fs-btn" aria-label="Full screen"></button>
        <div class="hint3d">Drag to turn · scroll or pinch to zoom</div>
        <div class="stage-bottom">
          <div class="cap" id="c-cap"></div>
          <div class="ctrls" id="c-ctrls"></div>
        </div>
      </div>
      <aside class="panel" id="c-panel"></aside>
    </div>
  </section>

  <section class="view" id="v-combine" hidden aria-label="Combine two elements">
    <div class="split">
      <div class="stage" id="stage-combine">
        <button type="button" class="fs-btn" aria-label="Full screen"></button>
        <div class="hint3d">Drag to turn · scroll or pinch to zoom</div>
        <div class="stage-bottom">
          <div class="cap" id="m-cap"></div>
          <div class="ctrls" id="m-ctrls"></div>
        </div>
      </div>
      <aside class="panel" id="m-panel"></aside>
    </div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="js/core.js"></script>
