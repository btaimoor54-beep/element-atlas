# Publish the website to GitHub Pages on every push to main.
# The site is built from atlas/ by build/make-site.ps1 (PowerShell is preinstalled on GitHub's runners),
# so the public site and the Claude Artifact always come from the same source.
name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one publish at a time; a newer push replaces a waiting one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build site/ from atlas/
        shell: pwsh
        run: ./build/make-site.ps1 -BasePath '${{ steps.pages.outputs.base_path }}'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
